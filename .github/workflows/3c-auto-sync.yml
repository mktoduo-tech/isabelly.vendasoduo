name: 3C Auto-Sync (a cada 5 min)

on:
  schedule:
    - cron: '*/5 * * * *'  # Roda a cada 5 minutos
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sincronizar calls 3C Plus

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Rodar sync
        env:
          PIPEDRIVE_TOKEN: ${{ secrets.PIPEDRIVE_TOKEN }}
          THREE_C_PLUS_TOKEN: ${{ secrets.THREE_C_PLUS_TOKEN }}
        run: python sdr-briefing/3c-auto-sync.py

      - name: Log de conclusão
        if: always()
        run: echo "✅ Sync finalizado"
